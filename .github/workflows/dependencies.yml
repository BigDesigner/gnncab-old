name: Dependency validation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:dependencies
      - run: pnpm --filter @workspace/api-spec run codegen:check
      - run: pnpm run build
      - run: pnpm run audit:dependencies
